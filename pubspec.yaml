name: alradi_app
description: A new Flutter project.
publish_to: 'none'
version: 0.1.1+5

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.2
  date_time_format: ^2.0.1
  enefty_icons: ^1.0.5
  eva_icons_flutter: ^3.1.0
  expandable: ^5.0.1
  firebase_core: ^4.1.1
  flutter:
    sdk: flutter
  flutter_emoji: ^2.5.1
  flutter_form_builder: ^10.2.0
  salomon_bottom_bar: ^3.3.2
  url_launcher: ^6.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Light.ttf